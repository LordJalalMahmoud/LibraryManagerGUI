name: Native Release Packaging

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag Version (e.g. v1.2.0)'
        required: false
        default: 'v1.2.0'
      is_draft:
        description: 'Create as Draft Release?'
        type: boolean
        default: false
      is_prerelease:
        description: 'Create as Pre-release?'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package-linux:
    name: Package Linux (.deb & Portable)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Fat JAR
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests=true

      - name: Make packaging script executable
        run: chmod +x package-native.sh

      - name: Build Native Linux Packages
        run: ./package-native.sh all

      - name: Upload Linux Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            target/dist/*.deb
            target/dist/*.tar.gz

  package-windows:
    name: Package Windows (.msi & Standalone)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Fat JAR
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests=true

      - name: Build Native Windows Packages (jpackage)
        shell: bash
        run: |
          APP_VERSION=$(grep -m1 '<version>' pom.xml | sed -E 's/.*<version>([^<]+)<\/version>.*/\1/')
          mkdir -p target/package-input target/dist
          JAR_FILE=$(ls target/library-manager-*.jar | grep -v 'original' | head -n 1)
          JAR_NAME=$(basename "$JAR_FILE")
          cp "$JAR_FILE" target/package-input/
          
          # Standalone Image
          jpackage \
            --type app-image \
            --name LibraryManager \
            --app-version "$APP_VERSION" \
            --vendor LibraryManager \
            --description "Modern Personal Library Management Desktop Application" \
            --input target/package-input \
            --main-jar "$JAR_NAME" \
            --main-class com.librarymanager.Launcher \
            --dest target/dist \
            --java-options "-Dfile.encoding=UTF-8" \
            --add-modules java.base,java.desktop,java.sql,java.scripting,java.logging,java.management,java.naming,jdk.unsupported,jdk.jfr
          
          # Native MSI Installer
          jpackage \
            --type msi \
            --name LibraryManager \
            --app-version "$APP_VERSION" \
            --vendor LibraryManager \
            --description "Modern Personal Library Management Desktop Application" \
            --input target/package-input \
            --main-jar "$JAR_NAME" \
            --main-class com.librarymanager.Launcher \
            --dest target/dist \
            --win-dir-chooser \
            --win-menu \
            --win-shortcut \
            --java-options "-Dfile.encoding=UTF-8" \
            --add-modules java.base,java.desktop,java.sql,java.scripting,java.logging,java.management,java.naming,jdk.unsupported,jdk.jfr

          # Rename MSI if needed
          if [ -f "target/dist/LibraryManager-${APP_VERSION}.msi" ]; then
            cp "target/dist/LibraryManager-${APP_VERSION}.msi" "target/dist/LibraryManager-${APP_VERSION}-windows-x64.msi"
          elif [ -f "target/dist/LibraryManager.msi" ]; then
            cp "target/dist/LibraryManager.msi" "target/dist/LibraryManager-${APP_VERSION}-windows-x64.msi"
          fi

          # Compress portable directory
          cd target/dist
          7z a LibraryManager-${APP_VERSION}-windows-x64.zip LibraryManager

      - name: Upload Windows Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            target/dist/*.msi
            target/dist/*.zip

  package-macos:
    name: Package macOS (.dmg, .pkg & .app)
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Fat JAR
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests=true

      - name: Make packaging script executable
        run: chmod +x package-native-macos.sh

      - name: Build Native macOS Packages
        run: ./package-native-macos.sh all

      - name: Upload macOS Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            target/dist/*.dmg
            target/dist/*.pkg
            target/dist/*.tar.gz

  publish-release:
    name: Publish Production GitHub Release
    needs: [package-linux, package-windows, package-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create release staging directory
        run: mkdir -p release-assets

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          echo "=== Release Assets Ready for Publishing ==="
          ls -lh

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.2.0' }}
          name: "LibraryManager ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.2.0' }}"
          body_path: RELEASE_NOTES.md
          draft: ${{ inputs.is_draft || false }}
          prerelease: ${{ inputs.is_prerelease || false }}
          generate_release_notes: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
